<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu on a phone</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
a{color:#161616}a:hover{color:#5A3F06}
</style>
</head>
<body>
<div style="--ground: #F7F5EF; --surface: #FFFFFF; --sunken: #EFECE4; --text: #161616; --muted: #5C5B55; --line: #D2CFC6; --edge: #161616; --action: #161616; --on-action: #FFFFFF; --accent: #C8922A; --accent-soft: #F4E6C4; --accent-soft-text: #5A3F06; color-scheme: light; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--text); font-family: 'Hanken Grotesk', 'Segoe UI', Helvetica, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">

<header style="flex-shrink: 0; height: 60px; padding: 0 8px 0 16px; border-bottom: 1.5px solid var(--edge); display: flex; align-items: center; justify-content: space-between">
<div style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em">University Alumni</div>
<a href="phone-directory.html" aria-label="Close menu" style="width: 44px; height: 44px; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>

<nav aria-label="Main" style="display: flex; flex-direction: column">
<a href="#" style="min-height: 64px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--text); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; text-decoration: none; display: flex; align-items: center">Dashboard</a>
<a href="phone-directory.html" aria-current="page" style="min-height: 64px; padding: 0 16px; border-bottom: 1px solid var(--line); box-shadow: inset 6px 0 0 var(--accent); color: var(--text); font-size: 24px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; display: flex; align-items: center">Directory</a>
<a href="#" style="min-height: 64px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--text); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; text-decoration: none; display: flex; align-items: center">Feed</a>
<a href="#" style="min-height: 64px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--text); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; text-decoration: none; display: flex; align-items: center">My profile</a>
</nav>

<div style="padding: 24px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">Theme</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1.5px solid var(--edge); border-radius: 2px">
<button type="button" aria-pressed="true" style="height: 48px; border: 0; border-radius: 0; background: var(--action); color: var(--on-action); font-size: 15px; font-weight: 700; cursor: pointer">Light</button>
<button type="button" aria-pressed="false" style="height: 48px; border: 0; border-left: 1.5px solid var(--edge); border-radius: 0; background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer">Dark</button>
<button type="button" aria-pressed="false" style="height: 48px; border: 0; border-left: 1.5px solid var(--edge); border-radius: 0; background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer">System</button>
</div>
</div>

<div style="margin-top: auto; padding: 20px 16px 24px; border-top: 1.5px solid var(--edge); background: var(--ground); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 2px; background: var(--accent-soft); color: var(--accent-soft-text); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">TA</div>
<div style="display: flex; flex-direction: column">
<div style="font-size: 16px; font-weight: 700">Tanvir Ahmed</div>
<div style="font-size: 14px; color: var(--muted)">tanvir.ahmed@example.com</div>
</div>
</div>
<button type="button" style="height: 48px; border: 1.5px solid var(--edge); border-radius: 2px; background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer">Log out</button>
</div>

</div>
</body>
</html>
