<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
a{color:#161616}a:hover{color:#5A3F06}
</style>
</head>
<body>
<div style="--ground: #F7F5EF; --surface: #FFFFFF; --sunken: #EFECE4; --text: #161616; --muted: #5C5B55; --line: #D2CFC6; --edge: #161616; --focus: #9A6B12; --action: #161616; --on-action: #FFFFFF; --accent: #C8922A; --on-accent: #161616; --accent-edge: #161616; --band: #161616; --band-text: #FFFFFF; --band-muted: #D9D6CD; color-scheme: light; min-height: 100vh; box-sizing: border-box; background: var(--ground); color: var(--text); font-family: 'Hanken Grotesk', 'Segoe UI', Helvetica, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-wrap: wrap">

<section style="flex: 1 1 420px; box-sizing: border-box; padding: 56px; background: var(--band); color: var(--band-text); display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
<div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em">University Alumni</div>
<div style="display: flex; flex-direction: column; gap: 20px">
<div aria-hidden="true" style="width: 72px; height: 8px; background: var(--accent)"></div>
<div style="font-size: 64px; line-height: 0.98; font-weight: 700; letter-spacing: -0.04em; max-width: 520px">Stay close to the people you studied with.</div>
<div style="font-size: 19px; line-height: 1.45; color: var(--band-muted); max-width: 460px">Find graduates, follow their news and ask for advice.</div>
</div>
<div style="font-size: 14px; color: var(--band-muted)">For students, alumni and university staff.</div>
</section>

<main style="flex: 1 1 420px; box-sizing: border-box; padding: 40px 56px 56px; display: flex; flex-direction: column; gap: 32px">
<div style="align-self: flex-end; display: flex; border: 1.5px solid var(--edge); border-radius: 2px">
<button type="button" aria-label="Light theme" aria-pressed="true" style="width: 40px; height: 40px; border: 0; border-radius: 0; background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg></button>
<button type="button" aria-label="Dark theme" aria-pressed="false" style="width: 40px; height: 40px; border: 0; border-left: 1.5px solid var(--edge); border-radius: 0; background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></button>
<button type="button" aria-label="System theme" aria-pressed="false" style="width: 40px; height: 40px; border: 0; border-left: 1.5px solid var(--edge); border-radius: 0; background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></button>
</div>

<form style="flex-grow: 1; width: 100%; max-width: 420px; align-self: center; display: flex; flex-direction: column; justify-content: center; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 44px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em">Log in</h1>
<div style="font-size: 16px; color: var(--muted)">Use the email you signed up with.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="login-l-email" style="font-size: 14px; font-weight: 600">Email</label>
<input id="login-l-email" type="email" autocomplete="email" value="tanvir.ahmed@example.com" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid var(--edge); border-radius: 2px; background: var(--surface); color: var(--text); font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="login-l-pass" style="font-size: 14px; font-weight: 600">Password</label>
<div style="display: flex; border: 1.5px solid var(--edge); border-radius: 2px; background: var(--surface)">
<input id="login-l-pass" type="password" autocomplete="current-password" value="correcthorse" style="flex-grow: 1; min-width: 0; height: 45px; box-sizing: border-box; padding: 0 12px; border: 0; background: transparent; color: var(--text); font-size: 16px">
<button type="button" aria-pressed="false" style="height: 45px; padding: 0 14px; border: 0; border-left: 1.5px solid var(--edge); border-radius: 0; background: transparent; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer">Show</button>
</div>
</div>
<label style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: var(--action)">Remember my email on this device</label>
<button type="submit" style="height: 48px; padding: 0 24px; border: 1.5px solid var(--accent-edge); border-radius: 2px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; cursor: pointer">Log in</button>
<div style="padding-top: 16px; border-top: 1px solid var(--line); font-size: 15px">New here? <a href="signup.html" style="color: var(--text); font-weight: 700">Create an account</a></div>
</form>
</main>

</div>
</body>
</html>
