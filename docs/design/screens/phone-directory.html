<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alumni directory on a phone</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
a{color:#161616}a:hover{color:#5A3F06}
</style>
</head>
<body>
<div style="--ground: #F7F5EF; --surface: #FFFFFF; --sunken: #EFECE4; --text: #161616; --muted: #5C5B55; --line: #D2CFC6; --edge: #161616; --action: #161616; --on-action: #FFFFFF; --accent: #C8922A; --on-accent: #161616; --accent-edge: #161616; --accent-soft: #F4E6C4; --accent-soft-text: #5A3F06; --band: #161616; --band-text: #FFFFFF; --band-muted: #D9D6CD; color-scheme: light; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--ground); color: var(--text); font-family: 'Hanken Grotesk', 'Segoe UI', Helvetica, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">

<header style="flex-shrink: 0; height: 60px; padding: 0 8px 0 16px; background: var(--surface); border-bottom: 1.5px solid var(--edge); display: flex; align-items: center; justify-content: space-between">
<a href="#" style="color: var(--text); font-size: 17px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none">University Alumni</a>
<a href="phone-menu.html" aria-label="Open menu" style="width: 44px; height: 44px; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a>
</header>

<section style="flex-shrink: 0; background: var(--band); color: var(--band-text); padding: 28px 16px 76px; display: flex; flex-direction: column; gap: 10px">
<div aria-hidden="true" style="width: 48px; height: 6px; background: var(--accent)"></div>
<h1 style="margin: 0; font-size: 36px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em">Alumni directory</h1>
<div style="font-size: 16px; line-height: 1.45; color: var(--band-muted)">Find graduates and see who is open to mentoring.</div>
</section>

<main style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 20px">

<form role="search" style="position: relative; margin-top: -52px; background: var(--surface); border: 1.5px solid var(--edge); border-radius: 2px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ph-q" style="font-size: 14px; font-weight: 600">Search</label>
<input id="ph-q" type="search" placeholder="Name, company or job title" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid var(--edge); border-radius: 2px; background: var(--surface); color: var(--text); font-size: 16px">
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" aria-expanded="false" style="height: 48px; padding: 0 12px; border: 1.5px solid var(--edge); border-radius: 2px; background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>Filters</button>
<button type="submit" style="height: 48px; padding: 0 12px; border: 1.5px solid var(--accent-edge); border-radius: 2px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 700; cursor: pointer">Search</button>
</div>
</form>

<div style="font-size: 15px; font-weight: 600">86 alumni</div>

<article style="background: var(--surface); border: 1.5px solid var(--edge); border-radius: 2px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 2px; background: var(--accent-soft); color: var(--accent-soft-text); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">NR</div>
<span style="padding: 4px 10px; border-radius: 2px; background: var(--accent-soft); color: var(--accent-soft-text); font-size: 13px; font-weight: 600">Open to mentoring</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em">Nadia Rahman</h2>
<div style="font-size: 15px">Software Engineer</div>
<div style="font-size: 15px; color: var(--muted)">Nordlys Systems</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="padding: 3px 9px; border: 1px solid var(--line); border-radius: 2px; font-size: 13px">Computer Science</span>
<span style="padding: 3px 9px; border: 1px solid var(--line); border-radius: 2px; font-size: 13px">Class of 2019</span>
<span style="padding: 3px 9px; border: 1px solid var(--line); border-radius: 2px; font-size: 13px">Software</span>
</div>
<a href="#" style="min-height: 44px; border-top: 1px solid var(--line); color: var(--text); font-size: 15px; font-weight: 700; display: flex; align-items: center">View profile</a>
</article>

<article style="background: var(--surface); border: 1.5px solid var(--edge); border-radius: 2px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 2px; background: var(--accent-soft); color: var(--accent-soft-text); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">EL</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em">Erik Lindqvist</h2>
<div style="font-size: 15px">Product Designer</div>
<div style="font-size: 15px; color: var(--muted)">Havn Studio</div>
</div>
</article>

</main>

</div>
</body>
</html>
